services:

  frontend:
    build:
      context: ./frontend
    container_name: friday-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    container_name: friday-backend
    environment:
      MONGO_URI: mongodb://database:27017/devopsdb
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

  database:
    image: mongo:8
    container_name: friday-database
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: devopsdb
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
