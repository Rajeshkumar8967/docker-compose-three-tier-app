<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Docker Compose Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
            background: #f4f7f9;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        .architecture {
            display: flex;
            gap: 15px;
            margin: 30px 0;
        }

        .service {
            flex: 1;
            padding: 20px;
            border-radius: 8px;
            background: #eef2f7;
            text-align: center;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        #result {
            margin-top: 20px;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 8px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Docker Compose 3-Tier Application</h1>

    <p>
        Frontend, Backend and Database running as separate Docker containers.
    </p>

    <div class="architecture">

        <div class="service">
            <h3>Frontend</h3>
            <p>Nginx</p>
        </div>

        <div class="service">
            <h3>Backend</h3>
            <p>Node.js + Express</p>
        </div>

        <div class="service">
            <h3>Database</h3>
            <p>MongoDB</p>
        </div>

    </div>

    <button onclick="checkCommunication()">
        Test Container Communication
    </button>

    <div id="result">
        Click the button to test:
        Frontend → Backend → MongoDB
    </div>

</div>

<script>

async function checkCommunication() {

    const result = document.getElementById("result");

    result.textContent = "Testing communication...";

    try {

        const response = await fetch("/api/health");

        const data = await response.json();

        result.textContent =
            JSON.stringify(data, null, 2);

    } catch (error) {

        result.textContent =
            "Communication failed: " + error.message;

    }

}

</script>

</body>
</html>
